name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        shell: cmd
        run: |
          rc /nologo version.rc
          cl /nologo /O2 /MT /W3 /D_CRT_SECURE_NO_WARNINGS mouse1_watcher.c version.res user32.lib /Fe:Mouse1Watcher.exe /link /SUBSYSTEM:CONSOLE

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path Mouse1Watcher.exe, README.md -DestinationPath Mouse1Watcher.zip
          Get-FileHash Mouse1Watcher.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: Mouse1Watcher
          path: Mouse1Watcher.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Mouse1Watcher.zip
