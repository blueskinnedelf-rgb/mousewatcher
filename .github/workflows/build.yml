name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        shell: cmd
        run: |
          rc /nologo version.rc
          cl /nologo /O2 /MT /W3 /D_CRT_SECURE_NO_WARNINGS mouse1_watcher.c version.res user32.lib /Fe:Mouse1Watcher.exe /link /SUBSYSTEM:CONSOLE

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path Mouse1Watcher.exe, README.md -DestinationPath Mouse1Watcher.zip
          Get-FileHash Mouse1Watcher.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: Mouse1Watcher
          path: Mouse1Watcher.zip

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path mouse1_watcher.c -Pattern '#define VERSION "(\d+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Mouse1 Watcher v${{ steps.ver.outputs.version }}
          body: Download Mouse1Watcher.zip below, unzip it, and run Mouse1Watcher.exe. Built automatically by GitHub Actions from the source in this repo.
          files: Mouse1Watcher.zip
          make_latest: true
